
name: Terraform Code Quality and Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Needed for validate on a clean GitHub runner.
     

      - name: Terraform Validate All Directories
        shell: bash
        run: |
          set -e
          mapfile -t dirs < <(
            find . \
              -type d \
              \( -name .git -o -name .terraform \) -prune -o \
              -type f -name '*.tf' -printf '%h\n' |
            sort -u
          )

          for dir in "${dirs[@]}"; do
            echo "::group::Validating $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done


      - name: Install tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: .
          soft_fail: false

