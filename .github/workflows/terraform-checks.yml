name: Terraform Code Quality and Security

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - prod
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate All Directories
        shell: bash
        run: |
          set -e
          mapfile -t dirs < <(
            find . \
              -type d \
              \( -name .git -o -name .terraform \) -prune -o \
              -type f -name '*.tf' -printf '%h\n' |
            sort -u
          )

          for dir in "${dirs[@]}"; do
            echo "::group::Validating $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

      - name: Install tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: .
          soft_fail: false

  terraform-vpc:
    name: Deploy VPC
    needs: terraform-checks
    if: |
      github.ref_name == 'dev' ||
      (github.event_name == 'push' && github.ref_name == 'prod') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'prod' &&
       github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: setup-with-modules/${{ github.ref_name == 'dev' && 'dev' || 'prod' }}/vpc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform apply
        run: terraform apply -input=false

  terraform-ec2:
    name: Deploy EC2
    needs: terraform-vpc
    if: |
      github.ref_name == 'dev' ||
      (github.event_name == 'push' && github.ref_name == 'prod') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'prod' &&
       github.event.pull_request.head.ref == 'dev')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: setup-with-modules/${{ github.ref_name == 'dev' && 'dev' || 'prod' }}/ec2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform apply
        run: terraform apply -input=false